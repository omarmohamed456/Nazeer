[project]
name = "planet-explorer-api"
version = "0.2.0"
description = "Tile metadata and geology-based Earth analog API for the Moon and Mars"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.vercel]
entrypoint = "app.main:app"
